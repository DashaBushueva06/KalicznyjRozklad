{% extends 'base.html' %}

{% block content %}
    <h2>Управління аудиторіями</h2>

    <form class="add-form" action="/classrooms/add" method="POST" style="margin-bottom: 25px;">
        <h3>Додати аудиторію</h3>

        <label>Номер аудиторії:</label>
        <input type="number" name="room_number" min="0" max="1000" required>

        <label>Місткість:</label>
        <input type="number" name="capacity" min="1" required>

        <button type="submit">Зберегти</button>
    </form>

    <h3>Список аудиторій</h3>
    <table>
        <tr>
            <th>ID</th>
            <th>Номер аудиторії</th>
            <th>Місткість</th>
            <th>Дія</th>
        </tr>
        {% for classroom in classrooms %}
        <tr>
            <td>{{ classroom.id }}</td>
            <td>{{ classroom.room_number }}</td>
            <td>{{ classroom.capacity }}</td>
            <td>
                <form action="/classrooms/{{ classroom.id }}/delete" method="POST" style="margin:0; padding:0; background:none; border:none; width:auto;">
                    <button type="submit" style="color: red; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0;">Видалити</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
