{% extends 'base.html' %}

{% block content %}
    <h2>Список курсів</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Назва курсу</th>
            <th>Викладач</th>
            <th>Дія</th>
        </tr>
        {% for course in courses %}
        <tr>
            <td>{{ course.id }}</td>
            <td>{{ course.title }}</td>
            <td>{{ course.teacher.name if course.teacher else 'Невідомо' }}</td>
            <td>
                <form action="/courses/{{ course.id }}/delete" method="POST" style="margin:0; padding:0; background:none; border:none; width:auto;">
                    <button type="submit" style="color: red; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0;">Видалити</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    <form class="add-form" action="/courses/add" method="POST">
        <h3>Додати курс</h3>
        <label>Назва курсу:</label>
        <input type="text" name="title" required>

        <label>Викладач:</label>
        <select name="teacher_id" required>
            <option value="" disabled selected>Оберіть викладача</option>
            {% for teacher in teachers %}
            <option value="{{ teacher.id }}">{{ teacher.name }}</option>
            {% endfor %}
        </select>

        <button type="submit">Зберегти</button>
    </form>
{% endblock %}
